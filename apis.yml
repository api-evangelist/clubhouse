aid: clubhouse
name: Clubhouse
description: >-
  Clubhouse (Alpha Exploration Co.) is a social audio application founded in 2020 by Paul Davison and
  Rohan Seth, backed by Andreessen Horowitz (a16z) and Kindred Ventures. It popularized live "drop-in"
  audio chat rooms where people gather to talk, listen, and learn in real time across clubs, channels,
  and scheduled events. Clubhouse ships consumer iOS and Android apps and operates its service on the
  clubhouse.com / clubhouseapi.com domains. The company does not publish an official, documented public
  developer API or SDK; the only machine-readable interfaces are third-party, reverse-engineered clients
  maintained by the community and not endorsed by Alpha Exploration Co. This API Evangelist profile
  captures the provider's real public surface — website, legal, and support properties plus a live
  domain-security probe — with no fabricated API artifacts.
